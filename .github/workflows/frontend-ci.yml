name: Frontend CI

on:
  pull_request:
    branches: [main, cicd]
  push:
    branches: [cicd]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run Lighthouse CI (no-fail)
        run: |
          npx lhci autorun || echo "Lighthouse completed (failures ignored)"
